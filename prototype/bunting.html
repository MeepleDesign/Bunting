<title>Bunting Party Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Caveat:wght@600&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: consumer marketplace shell — slim top nav, photo-led cards, one view at a time; supplier side reuses the same system in a denser dashboard */
:root{
  --bg:#FAFAFC; --surface:#FFFFFF; --sunk:#F1F2F6; --ink:#16203A; --muted:#5E667A; --line:#E4E6EE;
  --accent:#D6336C; --accent-soft:#FCE8EF; --accent-ink:#FFFFFF; --sea:#13807F; --sea-soft:#E0F2F1; --sun:#F2B12E; --sun-soft:#FDF3DC;
  --good:#23845A; --good-soft:#E2F4EA; --warn:#97640F; --warn-soft:#FBF0D8; --bad:#B23A34; --bad-soft:#F9E4E2;
  --shadow:0 1px 2px rgba(22,32,58,.06),0 8px 24px rgba(22,32,58,.06);
  --display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1320; --surface:#171C2B; --sunk:#202638; --ink:#EDEFF5; --muted:#A3AABB; --line:#2A3144;
  --accent:#F06A97; --accent-soft:#3A1E2B; --accent-ink:#22101A; --sea:#4FC3BE; --sea-soft:#163332; --sun:#F5C452; --sun-soft:#3A3120;
  --good:#6DCB9D; --good-soft:#18342A; --warn:#E8B866; --warn-soft:#3A2F1B; --bad:#F08D86; --bad-soft:#3D2321;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#171C2B; --sunk:#202638; --ink:#EDEFF5; --muted:#A3AABB; --line:#2A3144;
  --accent:#F06A97; --accent-soft:#3A1E2B; --accent-ink:#22101A; --sea:#4FC3BE; --sea-soft:#163332; --sun:#F5C452; --sun-soft:#3A3120;
  --good:#6DCB9D; --good-soft:#18342A; --warn:#E8B866; --warn-soft:#3A2F1B; --bad:#F08D86; --bad-soft:#3D2321;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
.serif{font-family:var(--display);font-weight:400;letter-spacing:-.005em}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,52px)}
h2{font-family:var(--display);font-weight:400;font-size:28px}
h3{font-size:16px;font-weight:700}
p{margin:0}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.sub{font-size:12.5px;color:var(--muted)}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
svg.i{width:16px;height:16px;flex:none;vertical-align:-3px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1200px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px 22px;align-items:center;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;border:0;background:none;cursor:pointer;padding:0}
.logo b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1}
.links{display:flex;gap:2px;flex-wrap:wrap}
.link{border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14.5px}
.link:hover{color:var(--ink);background:var(--sunk)}
.link[aria-current="true"]{color:var(--ink);background:var(--sunk)}
.nav-r{margin-left:auto;display:flex;gap:10px;align-items:center}
.sl-count{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:4px}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.lg{padding:13px 22px;font-size:15.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:1200px;margin:0 auto;padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.sea{background:var(--sea-soft);color:var(--sea)}

.art{display:block;width:100%;height:100%}
.media{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--sunk);max-width:100%}
.heart{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;color:#16203A;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.heart svg{width:18px;height:18px}
.heart[aria-pressed="true"]{color:#D6336C}
.heart[aria-pressed="true"] svg path{fill:#D6336C}
.badge{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94);color:#16203A;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-flex;gap:5px;align-items:center}
.stars{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13.5px}
.stars svg{width:14px;height:14px;color:var(--sun)}

/* HOME */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:34px;align-items:center;padding-block:16px 6px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(42px,6.4vw,76px);line-height:.98}
.hero h1 em{color:var(--accent)}
.hero .lede{font-size:18px;color:var(--muted);margin-top:16px;max-width:34em}
.searchbox{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:4px;align-items:stretch}
@media (max-width:760px){.searchbox{grid-template-columns:repeat(2,minmax(0,1fr))}.searchbox .btn{grid-column:1/-1}}
.sf{display:grid;gap:2px;padding:8px 12px;border-radius:12px}
.sf:hover{background:var(--sunk)}
.sf label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.sf input,.sf select{border:0;background:transparent;padding:0;min-width:0;width:100%;font-weight:500;color:var(--muted)}
.collage{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:440px}
.collage .media{aspect-ratio:auto;height:100%;border-radius:18px}
.collage .media:first-child{grid-row:1/3}
.collage .tag{position:absolute;left:12px;bottom:12px;background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:13px}
@media (max-width:900px){.collage{height:300px}}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.trust{grid-template-columns:minmax(0,1fr)}}
.trust div{display:flex;gap:12px;align-items:flex-start}
.trust .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:480px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cattile{border:0;background:none;padding:0;cursor:pointer;text-align:left;display:grid;gap:8px}
.cattile .media{aspect-ratio:1/1}
.cattile b{font-size:14px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.step .n{font-family:var(--display);font-size:44px;color:var(--accent);line-height:1}
.supbanner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--ink);color:var(--bg);border-radius:20px;padding:28px}
.supbanner .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}
@media (max-width:700px){.supbanner{grid-template-columns:minmax(0,1fr)}}
.supbanner .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}

/* SUPPLIER CARDS */
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px 18px}
.sup{display:grid;gap:10px;cursor:pointer;text-align:left;border:0;background:none;padding:0}
.sup:hover .media .art{transform:scale(1.03)}
.media .art{transition:transform .35s ease}
.sup .meta{display:grid;gap:3px}
.sup .price b{font-size:17px}
.featured-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:18px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.featured-row > *{scroll-snap-align:start}

/* SEARCH */
.searchlayout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:900px){.searchlayout{grid-template-columns:minmax(0,1fr)}}
.filters{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));display:grid;gap:18px}
@media (max-width:900px){.filters{position:static}}
.field{display:grid;gap:6px}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0;width:100%}
.field input[type=range]{padding:0;border:0;accent-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{accent-color:var(--accent);width:17px;height:17px}

/* PROFILE MODAL */
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.55);z-index:20}
.modal{position:fixed;z-index:21;inset:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));max-width:1040px;margin:0 auto;background:var(--surface);border-radius:20px;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
@media (max-width:640px){.modal{inset:env(safe-area-inset-top,0px) 0 0 0;border-radius:18px 18px 0 0}}
.modal-in{padding:22px;display:grid;gap:22px}
.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:340px}
.gallery .media{aspect-ratio:auto;height:100%;border-radius:12px}
.gallery .media:first-child{grid-row:1/3}
@media (max-width:640px){.gallery{height:220px}}
.profile{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.profile{grid-template-columns:minmax(0,1fr)}}
.bookbox{position:sticky;top:0;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:grid;gap:12px;background:var(--surface)}
.calc{display:grid;gap:7px}
.calc .line{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.calc .total{border-top:1px solid var(--line);padding-top:10px;margin-top:2px;font-weight:800;font-size:17px}
.incl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
@media (max-width:520px){.incl{grid-template-columns:minmax(0,1fr)}}
.incl div{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.incl svg{color:var(--good);margin-top:2px}
.review{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
.confirm{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px;display:grid;gap:10px}

/* WORKSPACE */
.cover{position:relative;border-radius:20px;overflow:hidden;min-height:240px;display:grid;align-items:end;color:#fff}
.cover .bg{position:absolute;inset:0}
.cover .in{position:relative;padding:28px;display:flex;gap:18px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;background:linear-gradient(transparent,rgba(10,14,30,.55))}
.cover h1{font-size:clamp(40px,6vw,64px);color:#fff}
.cover .meta{display:flex;gap:6px 16px;flex-wrap:wrap;opacity:.92;margin-top:6px;font-weight:500}
.countdown{background:rgba(255,255,255,.95);color:#16203A;border-radius:16px;padding:12px 18px;text-align:center;min-width:120px}
.countdown b{font-family:var(--display);font-size:40px;font-weight:400;line-height:1;display:block}
.avatars{display:flex;align-items:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:2px solid #fff;margin-left:-9px;color:#fff}
.av:first-child{margin-left:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat .v{font-family:var(--display);font-size:34px;line-height:1.1}
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.lines{display:grid}
.ln{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.ln:first-child{border-top:0}
.ln .thumb{width:52px;height:52px;border-radius:12px;overflow:hidden}
.ln .nums{display:flex;gap:18px;align-items:center;text-align:right}
.ln .nums div{display:grid}
@media (max-width:640px){.ln{grid-template-columns:44px minmax(0,1fr)}.ln .thumb{width:44px;height:44px}.ln .nums{grid-column:1/-1;justify-content:space-between;text-align:left}}
.mini{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-top:6px;max-width:220px}
.mini span{display:block;height:100%;background:var(--sea)}
.mini span.over{background:var(--bad)}
.tasks{display:grid;gap:2px}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.task.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.task.done span.t{color:var(--muted);text-decoration:line-through}
.threads{display:flex;gap:6px;flex-wrap:wrap}
.msgs{display:grid;gap:8px;max-height:260px;overflow-y:auto;padding:4px 0}
.msg{max-width:85%;padding:9px 13px;border-radius:16px 16px 16px 4px;font-size:14px;background:var(--sunk)}
.msg.me{justify-self:end;background:var(--accent-soft);border-radius:16px 16px 4px 16px}
.msg .t{font-size:11px;color:var(--muted);margin-top:2px}
.msg.sys{justify-self:center;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:12.5px;text-align:center;border-radius:10px}
.send{display:flex;gap:8px}
.send input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap}
.inline-form select,.inline-form input{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-width:0}

/* GUESTS */
.phone{max-width:370px;justify-self:center;width:100%;background:var(--surface);border:8px solid var(--ink);border-radius:36px;overflow:hidden;box-shadow:var(--shadow)}
.invite-top{position:relative;color:#fff;min-height:220px;display:grid;align-items:end}
.invite-top .bg{position:absolute;inset:0}
.invite-top .in{position:relative;padding:22px;background:linear-gradient(transparent,rgba(10,14,30,.55))}
.invite-top h2{font-size:38px;color:#fff}
.invite-body{padding:20px;display:grid;gap:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.live{border-radius:14px;background:var(--sun-soft);padding:14px 16px;display:grid;gap:4px}
.glist{display:grid}
.gr{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.gr:first-child{border-top:0}
.gav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--sunk);color:var(--muted)}
.statusbtn{border:0;background:none;cursor:pointer;padding:0}
@media (max-width:480px){.gr{grid-template-columns:36px minmax(0,1fr) auto}.gr .paycol{display:none}}

/* SUPPLIER */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center;font-size:13px}
.cal .d{padding:8px 0;border-radius:8px;background:var(--sunk)}
.cal .d.bk{background:var(--accent);color:var(--accent-ink);font-weight:800}
.cal .d.off{background:transparent}
.cal .h{color:var(--muted);font-weight:700;font-size:11px}
.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.settings{grid-template-columns:repeat(2,minmax(0,1fr))}}
.profilecomp{display:grid;gap:8px}

.foot{border-top:1px solid var(--line);padding-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
@media (prefers-reduced-motion:reduce){.media .art{transition:none}}

.opt{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;background:var(--surface);text-align:left;width:100%;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt[aria-checked="true"],.opt.current{border-color:var(--accent);background:var(--accent-soft)}
.opt .top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}

// ===== TRUST

  if(t.dbs)out.push({k:'dbs',ok:t.dbs.status==='checked',label:t.dbs.status==='checked'?'DBS checked':'DBS being checked'});return out}
const hygBox=n=>`<span class="hyg hyg${n>=4?'hi':n>=3?'mid':'lo'}">${n}</span>`;
function trustPills(s){return trustItems(s).map(x=>`<span class="pill ${x.ok?'good':'neutral'}">${x.k==='hyg'&&x.ok?hygBox(x.rating):I.shield} ${esc(x.label)}</span>`).join('')}

function trustOk(s){const t=s.trust||{};if(S.search.ins&&!(t.ins&&t.ins.status==='checked'))return false;if(S.search.hyg&&t.hyg&&!(t.hyg.status==='checked'&&t.hyg.rating>=4))return false;return true}
function checkedSection(s){const t=s.trust||{},rows=[];
  rows.push(t.ins&&t.ins.status==='checked'?['ok','Public liability insurance',`${t.ins.cover} cover, valid until ${dfmt(t.ins.exp)}`]:t.ins?['wait','Public liability insurance','Certificate uploaded, Bunting is checking it']:['no','Public liability insurance',insRequired(s)?'Not provided yet':'No insurance provided. If your venue asks suppliers for insurance, check with them before booking.']);
  if(t.hyg)rows.push(t.hyg.status==='checked'?['ok','Food hygiene rating',`Rated ${t.hyg.rating}${t.hyg.rating===5?' (very good)':t.hyg.rating===4?' (good)':t.hyg.rating===3?' (generally satisfactory)':''}, inspected ${dfmt(t.hyg.date,{month:'long',year:'numeric'})} by the local council. Checked automatically with the Food Standards Agency ${HYG_CAD[SETTINGS.hygCad||'weekly']}`]:['wait','Food hygiene rating','Bunting is checking the public listing']);

function mTrust(){return `<div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="trtitle" tabindex="-1"><div class="modal-in">

// ===== POLICIES & CANCELLATIONS
const POLNAME={flex:'Flexible',mod:'Moderate',strict:'Strict'};
function policyHTML(s,evDate){const d=daysTo(evDate);
  if(s.cancel==='strict')return `<div class="pol"><div class="pr now"><span class="you">Applies now</span><b>Any time</b><span>${s.depositPct}% deposit is kept. Anything else you've paid comes back.</span></div></div>`;
  const [lim,lo]=s.cancel==='flex'?[14,0]:[60,50],cut=addDays(evDate,-lim),after=d<lim;
  return `<div class="pol"><div class="pr ${after?'':'now'}">${after?'':'<span class="you">You are here</span>'}<b>Until ${dfmt(cut,{day:'numeric',month:'short'})}</b><span>Full refund</span></div><div class="pr ${after?'now':''}">${after?'<span class="you">You are here</span>':''}<b>From ${dfmt(addDays(cut,1),{day:'numeric',month:'short'})}</b><span>${lo?lo+'% refund':'No refund'}</span></div><div class="pr"><b>${dfmt(evDate,{day:'numeric',month:'short'})}</b><span>Party day</span></div></div>`}
function guestPaidFor(ev,sup){return ev&&ev.share&&ev.share.sup===sup?shareTotal(ev):0}
function ownPaid(bk){return bkPaid(bk)}
function custRefund(l,ev){ev=ev||S.event;const q=lineQuote(l,ev),s=q.s,gp=guestPaidFor(ev,s.id),own=Math.min(ownPaid(l.booking),Math.max(0,q.total-gp)),d=daysTo(ev.date);let back;
  if(s.cancel==='strict')back=Math.max(0,own-bkDeposit(l.booking));else{const [lim,lo]=s.cancel==='flex'?[14,0]:[60,50];back=own*(d>=lim?1:lo/100)}
  return{q,s,own,gp,back,kept:own-back,d}}
function refundGuests(ev,sup){if(!ev.share||ev.share.sup!==sup)return 0;let n=0;ev.guests.forEach(g=>{if(g.paid){g.paid=false;g.paidQty=0;g.refunded=true;n++}});return n}
function doCancel(ev,l,by,o){const r=custRefund(l,ev),sup=l.booking.sup;const full=by!=='you';
  const c={sup,by,back:full?r.own:r.back,gp:r.gp,kept:full?0:r.kept,date:TODAY,reason:o.reason||'',msg:o.msg||'',seen:by==='you'||by==='move',pkg:pkgOf(SUP[sup],l.booking.pkg).name};
  c.guests=refundGuests(ev,sup);c.payments=l.booking.payments||[];l.booking=null;l.cancelled=c;
  const oa=accOfEvent(ev),th=(oa&&ACC[oa]?ACC[oa].threads:S.threads);(th[sup]=th[sup]||[]).push({from:'sys',text:by==='supplier'?`${SUP[sup].name} cancelled this booking. Full refund of ${fmt(c.back+c.gp)} issued.`:`Booking cancelled by ${ev===SAMEV()?'Tony':'the organiser'}. ${fmt(c.back)} refunded${c.kept?`, ${fmt(c.kept)} kept under the ${POLNAME[SUP[sup].cancel].toLowerCase()} policy`:''}.`,t:nowLabel()});
  return c}
function mCancel(){const l=S.lines.find(x=>x.cat===S.modal.cat);if(!l||!l.booking){S.modal=null;return ''}const r=custRefund(l),s=r.s,rs=S.cxReason;
  return `<div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="cxtitle" tabindex="-1"><div class="modal-in">

    <div class="stack" style="gap:8px"><h3>${POLNAME[s.cancel]} cancellation policy</h3>${policyHTML(s,S.event.date)}<span class="sub">You're ${r.d} days before the party. You agreed to this policy when you booked.</span></div>
    <div class="refund num"><div class="line"><span>You've paid</span><span>${fmt(r.own)}</span></div>
      <div class="line big"><span>Refunded to you</span><b style="color:var(--good)">${fmt(r.back)}</b></div>
      ${r.kept>0?`<div class="line"><span>Kept by ${esc(s.name)} <span class="sub">(${s.cancel==='strict'?'non-refundable deposit':'late cancellation'})</span></span><span>${fmt(r.kept)}</span></div>`:''}
      ${r.gp?`<div class="line"><span>Guest food contributions</span><span>${fmt(r.gp)} back to guests</span></div>`:''}
      <span class="sub">Refunds reach the card used in 5 to 10 working days.${r.gp?' Guests always get their share back in full.':''}</span></div>
    <div class="stack" style="gap:6px"><span class="label">Why are you cancelling?</span><div class="chips">${['Found something else','Plans have changed','Over budget','Party is cancelled','Something else'].map(x=>`<button class="chip" data-cxreason="${x}" aria-pressed="${rs===x}">${x}</button>`).join('')}</div></div>
    <div class="tip small"><span>Need a different date instead? Suppliers can usually move without any charge.</span><button class="btn sm" data-editevent>Move your event</button></div>
    <div class="row"><button class="btn dangerbtn" data-cxconfirm ${rs?'':'disabled'}>${rs?`Cancel booking · ${fmt(r.back)} back`:'Choose a reason to continue'}</button><button class="btn" data-close>Keep booking</button></div>
  </div></div>`}
function supRow(key){return supBookings().find(x=>x.key===key)}
function mSCancel(){const b=supRow(S.modal.key);if(!b){S.modal=null;return ''}const s=SUP[S.supplierAs],rs=S.scxReason;
  let own=b.deposit?b.q.deposit:0,gp=0;if(b.line){gp=guestPaidFor(b.ev,s.id);own=Math.min(ownPaid(b.line.booking),b.q.total-gp)}
  const first=b.who.split(' ')[0],soon=daysTo(b.date)<=30;

// ===== DATE MOVES
function pierData(){return SUPDATA.pierplate||{others:S.others,ownClients:S.ownClients,requests:S.requests}}
function requestMove(to){if(!to)return;if(S.event.lines.some(l=>l.booking)){S.modal={type:'move',to};render()}else{S.event.date=to;S.search.date=null;toast(`${S.event.name} moved to ${dfmt(to,{day:'numeric',month:'short'})}`);render()}}
function mMove(){const ev=S.event,to=S.modal.to,from=ev.date,g=evGuests(ev);
  const rows=ev.lines.filter(l=>l.booking).map(l=>{const s=SUP[l.booking.sup],qo=quote(s.id,g,from,l.booking,evCtx(ev)),qn=quote(s.id,g,to,l.booking,evCtx(ev)),busy=supBlocked(s.id,to);
    return `<div class="mvrow"><span class="thumb">${art(s.cat,s.seed,{noBunting:true})}</span><div style="min-width:0"><b>${esc(s.name)}</b><div class="sub">${CAT1[s.cat]} · ${busy?'<b style="color:var(--bad)">Calendar shows busy</b>':'Calendar shows free'}</div></div><div class="num" style="text-align:right"><b>${fmt(qn.total)}</b><div class="sub">${qn.total===qo.total?'Same price':(qn.total>qo.total?'+':'−')+fmt(Math.abs(qn.total-qo.total)).replace('−','')+' on new date'}</div></div></div>`}).join('');
  return `<div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="mvtitle" tabindex="-1"><div class="modal-in">
    <div class="row between"><span class="label">Change the date</span><button class="btn sm" data-close>Close</button></div>
    <h2 id="mvtitle" style="font-size:36px">Move ${esc(ev.name)}?</h2>
    <div class="mvdates"><div><span class="sub">From</span><b>${dfmt(from,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</b></div><span class="arrow">→</span><div><span class="sub">To</span><b>${dfmt(to,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</b></div></div>
    <div class="stack" style="gap:8px"><h3>Your booked suppliers</h3><p class="sub">Each one is asked to confirm the new date. Prices follow each supplier's own date pricing.</p>${rows}</div>
    <div class="tip small"><span>If someone can't make the new date, you choose what happens: move back, or cancel them with a <b>full refund</b> and rebook. Nobody is charged for asking.</span></div>
    <div class="row"><button class="btn primary" data-moveconfirm>Ask suppliers to move</button><button class="btn" data-close>Keep ${dfmt(from,{day:'numeric',month:'short'})}</button></div>
  </div></div>`}
function startMove(to){const ev=S.event,from=ev.date;ev.moveFrom=from;ev.date=to;S.search.date=null;const th=S.threads;
  ev.lines.filter(l=>l.booking).forEach(l=>{const sid=l.booking.sup;l.booking.move={from,to,status:'pending'};(th[sid]=th[sid]||[]).push({from:'sys',text:`Asked to move from ${dfmt(from,{day:'numeric',month:'short'})} to ${dfmt(to,{day:'numeric',month:'short'})}.`,t:nowLabel()});
    if(isLiveSup(sid)&&S.acctKey&&S.acctKey!=='guest'){notify('sup:'+sid,`${acctFirst()} asked to move ${ev.name} to ${dfmt(to,{day:'numeric',month:'short'})}`,'supplier');supData(sid).requests.unshift({id:'dc'+Date.now(),type:'datechange',status:'new',acc:S.acctKey,name:ev.name,who:shortName(S.acctKey),date:to,from,guests:confirmedOf(ev),pkg:l.booking.pkg,received:'Just now',note:"Sorry to move things! Can you still do it on the new date?",evId:ev.id,cat:l.cat})}
    else setTimeout(()=>{const m=l.booking&&l.booking.move;if(!m||m.to!==to||m.status!=='pending')return;const busy=supBlocked(sid,to);m.status=busy?'declined':'accepted';(th[sid]=th[sid]||[]).push({from:'them',text:busy?`Sorry, we're already booked on ${dfmt(to,{day:'numeric',month:'short'})}. We can still do ${dfmt(from,{day:'numeric',month:'short'})}.`:`No problem, ${dfmt(to,{day:'numeric',month:'short'})} works for us.`,t:nowLabel()});toast(busy?`${SUP[sid].name} can't do ${dfmt(to,{day:'numeric',month:'short'})}. See your options on My event`:`${SUP[sid].name} confirmed the new date`);if(!S.modal&&(S.view==='workspace'||S.view==='messages'))render()},1200+Math.random()*1800)})}
function moveBack(ev){const from=ev.moveFrom;if(!from)return;ev.date=from;ev.lines.forEach(l=>{if(l.booking)delete l.booking.move});ev.moveFrom=null;Object.values(SUPDATA).forEach(pd=>{for(let i=pd.requests.length-1;i>=0;i--)if(pd.requests[i].type==='datechange'&&pd.requests[i].evId===ev.id)pd.requests.splice(i,1)});toast(`Back to ${dfmt(from,{day:'numeric',month:'short'})}. Suppliers have been told`)}
function alertsHTML(e){let out='';
  e.lines.filter(l=>l.cancelled&&l.cancelled.by==='supplier'&&!l.cancelled.seen).forEach(l=>{const c=l.cancelled,s=SUP[c.sup];
    out+=`<div class="alert bad"><div class="stack" style="gap:4px"><b>${esc(s.name)} has cancelled your ${CAT1[l.cat].toLowerCase()} booking</b><span class="small">A full refund of <b>${fmt(c.back)}</b> is on its way to you${c.gp?`, and ${fmt(c.gp)} back to ${c.guests} guests`:''}. Reason given: ${esc(c.reason.toLowerCase())}.</span>${c.msg?`<span class="small quote">"${esc(c.msg)}"</span>`:''}</div><div class="row"><button class="btn sm primary" data-find="${l.cat}" data-budget="${l.budget}">Find a replacement</button><button class="btn sm" data-rebook="${l.cat}">Ask Bunting to help</button><button class="btn sm ghost" data-dismisscx="${l.cat}">Dismiss</button></div></div>`});
  const mv=e.lines.filter(l=>l.booking&&l.booking.move);
  if(mv.length){const st=k=>mv.filter(l=>l.booking.move.status===k);const acc=st('accepted'),pend=st('pending'),dec=st('declined');
    if(pend.length||dec.length)out+=`<div class="alert ${dec.length?'warn':'info'}"><div class="stack" style="gap:6px;flex:1;min-width:0"><b>Moving ${esc(e.name)} to ${dfmt(e.date,{weekday:'short',day:'numeric',month:'short'})}</b>
      <div class="mvstat">${mv.map(l=>{const m=l.booking.move;return `<span class="pill ${m.status==='accepted'?'good':m.status==='declined'?'bad':'neutral'}">${m.status==='accepted'?I.check+' ':m.status==='pending'?I.clock+' ':''}${esc(SUP[l.booking.sup].name)}: ${m.status==='accepted'?'confirmed':m.status==='declined'?"can't make it":'waiting'}</span>`}).join('')}</div>
      ${dec.map(l=>`<div class="decl"><span class="small"><b>${esc(SUP[l.booking.sup].name)}</b> can't do the new date. Cancelling them is a <b>full refund</b>.</span><span class="row" style="gap:6px"><button class="btn sm primary" data-movereplace="${l.cat}">Cancel and find a replacement</button><button class="btn sm" data-movecancel="${l.cat}">Just cancel</button></span></div>`).join('')}</div>
      <div><button class="btn sm" data-moveback>Move back to ${dfmt(e.moveFrom,{day:'numeric',month:'short'})}</button></div></div>`;
    else out+=`<div class="alert good"><div class="stack" style="gap:4px"><b>Everyone can do ${dfmt(e.date,{weekday:'short',day:'numeric',month:'short'})}</b><span class="small">All ${acc.length} suppliers confirmed. Your guests' invite already shows the new date.</span></div><button class="btn sm" data-movedone>Done</button></div>`}
  return out?`<section class="alerts">${out}</section>`:''}

function setView(v){S.menu=false;
  if(v==='onboard'&&!S.ob)obInit('');
  if(v!=='login'&&v!=='onboard'){const role=S.user&&S.user.role;
    if(GATED.includes(v)&&role!=='planner'){if(role==='supplier'){v='supplier'}else{S.login={role:'planner',mode:'signin',note:v==='workspace'?'Sign in to see your events.':v==='guests'?'Sign in to manage your guest list.':'Sign in to see your messages.',next:v};v='login'}}
    else if(v==='supplier'&&role!=='supplier'&&!S.viewAs){S.login={role:'supplier',mode:'signin',note:'Sign in to your supplier dashboard.',next:'supplier'};v='login'}
    else if(role==='supplier'&&v!=='supplier'&&v!=='home'&&v!=='search'&&v!=='admin'&&v!=='invite'){v='supplier'}}
  if(S.viewAs&&v!=='supplier'&&v!=='search')exitViewAs();if(v!=='search')S.previewSup=null;if(S.view==='invite'&&v!=='invite'&&S.inv){S.event=S.inv.prev;S.myGuest=S.inv.prevGuest;S.inv=null}S.view=v;S.modal=null;S.confirming=false;S.bell=false;render();saveAcct();window.scrollTo(0,0)}
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.nav)));
let tt;function toast(t){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.innerHTML=I.check+' '+esc(t);clearTimeout(tt);tt=setTimeout(()=>el.remove(),2600)}
function render(){if(S.event&&(S.user&&S.user.role==='planner'||S.view==='invite'))try{reconcileRefunds(S.event,S.inv?S.inv.acc:S.acctKey)}catch(e){}
  document.querySelectorAll('.link').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===S.view));{const ml=document.querySelector('.link[data-nav="messages"]');const n=convList().filter(c=>unreadOf(c.id)).length;ml.innerHTML='Messages'+(n?` <span class="count">${n}</span>`:'')}
  const u=S.user,role=u&&u.role;
  document.querySelector('.links').hidden=role==='supplier'||S.view==='login'||S.view==='onboard'||S.view==='admin'||S.view==='invite'||!!S.viewAs;
  document.querySelectorAll('.link[data-nav="workspace"],.link[data-nav="guests"],.link[data-nav="messages"]').forEach(b=>b.hidden=role!=='planner');
  document.getElementById('navr').innerHTML=S.view==='onboard'?'':S.view==='login'?(u?'':`<button class="btn sm" data-nav2="home">Browse without an account</button>`):
    !u?`${adminBtn()}<button class="btn sm" data-shortlist>${I.heart} ${S.shortlist.size} saved</button><button class="btn sm ghost" data-golist>List your business</button><button class="btn sm dark" data-gologin>Sign in</button>`:
    `${adminBtn()}${bellHTML()}${role==='planner'?`<button class="btn sm" data-shortlist>${I.heart} ${S.shortlist.size} saved</button>`:''}<div class="acct"><button class="avbtn" data-menu aria-haspopup="true" aria-expanded="${S.menu}" aria-label="Account menu"><span class="av" style="background:${role==='supplier'?'#B33B26':'#D6336C'};margin:0;border-color:var(--surface)">${u.initials}</span><span class="small acctname">${esc(role==='supplier'?u.biz:u.first)}</span></button>
      ${S.menu?`<div class="menu" role="menu"><div class="mhead"><b>${esc(u.name)}</b><span class="sub">${esc(role==='supplier'?u.biz+' · supplier':u.email)}</span></div>
        ${role==='planner'?`<button role="menuitem" data-nav2="workspace">My events</button><button role="menuitem" data-nav2="messages">Messages</button>`:`<button role="menuitem" data-nav2="supplier">Dashboard</button><button role="menuitem" data-nav2="search">See Bunting as a customer</button>`}
        ${canSeeAdmin()?`<button role="menuitem" data-nav2="admin">Bunting admin</button>`:''}${role==='planner'?`<button role="menuitem" data-nset>Notification settings</button>`:''}
        <button role="menuitem" data-tourreopen>Take the tour</button>
        <button role="menuitem" data-switchacct="${role==='planner'?'supplier':'tony'}">Switch to ${role==='planner'?'supplier':'planner'} demo</button>
        <button role="menuitem" data-signout class="danger">Sign out</button></div>`:''}</div>`;
  document.body.classList.toggle('viewas',!!S.viewAs);app.innerHTML=liveBanner()+(S.view==='supplier'?viewAsBanner():'')+(['workspace','guests'].includes(S.view)?actAsBanner():'')+({login:vLogin,onboard:vOnboard,home:vHome,workspace:vWorkspace,search:vSearch,guests:vGuests,messages:vMessages,supplier:vSupplier,admin:vAdmin,invite:vInvitePage})[S.view]()+footerHTML();
  renderModal();persist();renderTour();
}
document.getElementById('navr').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.hasAttribute('data-nset')){S.menu=false;S.modal={type:'nset'};render();return}if(featClick(t))return;
  if(t.hasAttribute('data-shortlist')){S.search.shortOnly=true;S.search.cat='all';setView('search');return}
  if(t.hasAttribute('data-gologin')){S.login={role:'planner',mode:'signin',note:''};setView('login');return}
  if(t.hasAttribute('data-golist')){S.login={role:'supplier',mode:'signup',note:''};setView('login');return}
  if(t.hasAttribute('data-menu')){S.menu=!S.menu;render();return}
  if(t.dataset.nav2){setView(t.dataset.nav2);return}
  if(t.dataset.switchacct){loadAccount(t.dataset.switchacct);toast('Signed in as '+(S.user.role==='supplier'?S.user.biz:S.user.first));setView(S.user.role==='supplier'?'supplier':'workspace');return}
  if(t.hasAttribute('data-signout')){loadAccount('guest');toast('Signed out');setView('home');return}});
document.addEventListener('click',e=>{if(S.menu&&!e.target.closest('.acct')){S.menu=false;render()}});
function openSup(id){const s=SUP[id];const line=browsing()?null:S.lines.find(l=>l.booking&&l.booking.sup===id);
  if(line){S.bSel=null;S.modal={type:'booking',cat:line.cat};}else{const g=searchGuests();const best=fromQuote(id,g,searchDate());S.sel={pkg:best.p.id,addons:[],choices:defChoices(best.p)};S.modal={type:'sup',id};}
  S.confirming=false;renderModal()}

function supCard(id,guests){
  const s=SUP[id],q=fromQuote(id,guests,searchDate()),booked=S.lines.some(l=>l.booking&&l.booking.sup===id),na=!booked&&supBlocked(id,searchDate());
  return `<button class="sup" data-open="${id}">
    <div class="media">${s.photos&&s.photos[0]?`<img class="art" src="${imgSrc(s.photos[0])}" alt="" style="object-fit:cover">`:art(s.cat,s.seed,{label:s.name})}
      ${booked?`<span class="badge" style="color:#23845A">${I.check} Booked</span>`:na?`<span class="badge na">Unavailable ${dfmt(searchDate(),{day:'numeric',month:'short'})}</span>`:s.rating>=4.9?`<span class="badge">${I.star} Guest favourite</span>`:''}
      <span class="heart" role="button" tabindex="0" data-heart="${id}" aria-label="Save ${esc(s.name)}" aria-pressed="${S.shortlist.has(id)}">${I.heart}</span></div>
    <div class="meta">
      <div class="row between" style="flex-wrap:nowrap"><h3>${esc(s.name)}</h3>${s.reviews?`<span class="stars">${I.star}${s.rating.toFixed(1)} <span class="muted" style="font-weight:500">(${s.reviews})</span></span>`:'<span class="pill accent">New</span>'}</div>
      <span class="sub">${CAT1[s.cat]} · ${esc(s.area)}${s.packages.length>1?` · ${s.packages.length} packages`:''}</span>
      <span class="price">${s.packages.length>1?'<span class="sub">From </span>':''}<b class="num">${fmt(q.total)}</b> <span class="sub">for ${guests} guests</span></span>
      ${trustMini(s)}
      <span class="row" style="gap:6px;margin-top:2px">${na?'<span class="pill bad">Not free on your date</span>':q.needsQuote?'<span class="pill warn">Request a quote</span>':`<span class="pill sea">${I.bolt} Instant book</span>`}<span class="sub">${I.clock} Replies in ${s.reply}</span></span>
    </div></button>`;
}

function blurbFor(o){const n=o.name||'We',a=o.area||'Brighton & Hove';return ({venue:`${n} is a ${a} venue for private parties, with a bar, flexible layouts and space for up to 100 guests.`,catering:`${n} cooks fresh party food across ${a}, with vegetarian and vegan options as standard.`,dj:`${n} plays parties across ${a}, with lights, PA and a request list before the night.`,cake:`${n} bakes celebration cakes to order in ${a}, designed around your party.`,flowers:`${n} creates seasonal flowers and décor for parties across ${a}.`,photobooth:`${n} brings a photo booth with props and instant prints to parties across ${a}.`,bar:`${n} runs a mobile bar for parties across ${a}, from prosecco to cocktails.`,entertainment:`${n} entertains guests at parties across ${a}.`})[o.cat]}
function obInit(name){S.ob={step:1,building:-1,name:name||'',cat:'catering',area:'Brighton & Hove',web:'',blurb:'',tags:[],photos:[],found:3,packages:[],deposit:25,finalDays:14,ins:'',hyg:'',dbs:'',stripe:false}}

    <div class="field"><label class="label" for="ob-blurb">Description</label><textarea id="ob-blurb" rows="3" data-ob="blurb">${esc(o.blurb)}</textarea></div>

// EVENTS
function toggleHeart(id){if(S.shortlist.has(id)){S.shortlist.delete(id);toast('Removed from saved')}else{S.shortlist.add(id);toast(SUP[id].name+' saved')}}
function act(t,e){
  if(t.dataset.go){setView(t.dataset.go);return true}
  if(t.dataset.supgo){S.supTab='overview';setView('supplier');return true}
  if(t.dataset.catgo){S.search.cat=t.dataset.catgo;S.search.shortOnly=false;setView('search');return true}
  if(t.dataset.find){S.search.ctx=S.event.id;S.search.date=null;S.search.cat=t.dataset.find;S.search.max=Math.max(100,Number(t.dataset.budget));S.search.guests=null;S.search.shortOnly=false;setView('search');return true}
  if(t.dataset.pay){const amt=payBalance(S.event,t.dataset.pay);toast(`Paid ${fmt(amt)} to ${SUP[t.dataset.pay].name}`);notify('sup:'+t.dataset.pay,`${acctFirst()} paid the ${fmt(amt)} balance for ${S.event.name}`,'supplier');render();return true}
  if(t.dataset.booking){S.bSel=null;S.modal={type:'booking',cat:t.dataset.booking};renderModal();return true}
  if(t.dataset.sbook){S.modal={type:'sbook',idx:t.dataset.sbook};renderModal();return true}
  if(t.dataset.reqgo){S.supTab='requests';S.reqF='open';S.reqOpen=t.dataset.reqgo;render();return true}
  if(t.dataset.docgo){S.supTab='docs';S.docEdit=t.dataset.docgo;S.docDraft=S.docDraft||{};S.docDraft[t.dataset.docgo]=Object.assign({},((SUP[S.supplierAs].trust||{})[t.dataset.docgo])||{},{file:''});render();return true}
  if(t.dataset.stab){S.supTab=t.dataset.stab;S.modal=null;S.dnavOpen=false;render();if(window.innerWidth<900){const m=document.querySelector('.dmain');if(m)m.scrollIntoView({block:'start'})}return true}
  if(t.dataset.open){openSup(t.dataset.open);return true}
  return false;
}
app.addEventListener('click',e=>{
  const h=e.target.closest('[data-heart]');if(h){e.stopPropagation();toggleHeart(h.dataset.heart);render();return}
  const t=e.target.closest('button,[data-booking],[data-sbook],[data-calday]');if(!t)return;
  if(act(t,e))return;
  if(featClick(t))return;
  if(t.dataset.thread){S.activeThread=t.dataset.thread;render();return}
  if(t.dataset.review){const L=SUP[t.dataset.review];S.reviewDraft={sup:t.dataset.review,stars:0,cats:{quality:0,value:0,comms:0,punctual:0},text:''};S.modal={type:'review'};renderModal();return}
  if(t.dataset.replyopen){S.replyOpen=t.dataset.replyopen;render();refocus('rp-'+t.dataset.replyopen);return}
  if(t.hasAttribute('data-revlink')){const link='bunting.party/r/pier-and-plate';try{navigator.clipboard.writeText(link).then(()=>toast('Review link copied'),()=>toast('Link: '+link))}catch(err){toast('Link: '+link)}return}
  if(t.dataset.remind){const n=t.dataset.remind==='rsvp'?S.guests.filter(g=>g.status==='pending').length:S.guests.filter(g=>shareOwed(g)>0).length;toast(`Reminder sent to ${n} guests by email and text`);return}
  if(t.hasAttribute('data-newevent')){S.modal={type:'event',mode:'new',pre:{date:S.search.date,guests:S.search.guests}};renderModal();return}
  if(t.hasAttribute('data-cover')){S.coverTarget=null;S.coverDraft=JSON.parse(JSON.stringify(S.event.cover||{type:'preset',cat:'party',seed:1}));S.coverTab=S.coverDraft.type==='custom'?'create':S.coverDraft.type==='upload'?'upload':'gallery';S.modal={type:'cover'};renderModal();return}

  if(t.dataset.gtab){S.gTab=t.dataset.gtab;render();return}

  if(t.hasAttribute('data-sendinv')){const inv=invOf(S.event),first=!invSent(S.event),k=first?S.guests.length:S.guests.length-(inv.sentCount||0);inv.sentAt=inv.sentAt||TODAY;inv.sentCount=S.guests.length;toast(first?`Invite sent to ${k} guests by email and text`:`Invite sent to ${k} new guest${k===1?'':'s'}`);S.gTab='list';render();window.scrollTo(0,0);return}

  if(t.hasAttribute('data-ctxreset')){S.search.date=null;render();return}
  if(t.hasAttribute('data-moveevent')){requestMove(S.search.date);return}
  if(t.dataset.lrole){S.login.role=t.dataset.lrole;S.login.note='';render();return}
  if(t.dataset.lmode){S.login.mode=t.dataset.lmode;render();return}
  if(t.dataset.realme){if(S.login.role==='planner'){const k='u:'+ME.id;if(!ACC[k])ACC[k]={user:{role:'planner',uid:ME.id},events:[],threads:{},shortlist:new Set(),pastEvent:null,readAt:{},settings:{}};loadAccount(k);toast('Signed in as '+(ME.name||'you'));setView(S.login.next||'workspace')}
    else{const sid=Object.keys(SUP).find(id=>SUP[id].ownerUid===ME.id);if(sid){const k='s:'+ME.id;if(!ACC[k])ACC[k]={user:{role:'supplier',uid:ME.id},supId:sid};loadAccount(k);setView('supplier')}else{obInit('');S.ob.ownerUid=ME.id;setView('onboard')}}return}
  if(t.dataset.demo){const next=S.login.next;loadAccount(t.dataset.demo);toast('Signed in as '+(S.user.role==='supplier'?S.user.biz:S.user.first));setView(S.user.role==='supplier'?'supplier':(next||'workspace'));return}

  if(t.dataset.obphoto){S.ob.photos.splice(Number(t.dataset.obphoto),1);render();return}
  if(t.hasAttribute('data-loaddemo')){resetDemo();return}

function dbWrite(p,data){const q=LIVE.queue[p]||Promise.resolve();LIVE.queue[p]=q.then(()=>LIVE.db.doc(p).set(data)).catch(e=>{const c=e&&e.code;

  else if(c==='unavailable'){setTimeout(()=>{delete LIVE.last[p];persist()},1500+Math.random()*1000)}

function hostOf(ev){return (ev.collaborators||[]).find(c=>c.host)||(ev.collaborators||[])[0]}
function splitInfo(ev,l){const bk=l.booking,sp=bk&&bk.split;if(!sp||!(sp.cids||[]).length)return null;const q=lineQuote(l,ev);const base=Math.max(0,q.total-guestPaidFor(ev,bk.sup));const n=sp.cids.length,each=r2(base/n);const host=hostOf(ev);
  return {base,each,parts:sp.cids.map(cid=>{const c=(ev.collaborators||[]).find(x=>x.id===cid)||{n:'Someone',i:'?',c:'#888'};const paid=(bk.payments||[]).filter(p=>p.kind==='cohost'&&p.by===cid).reduce((a,p)=>a+p.amount,0);return{cid,c,isHost:host&&cid===host.id,paid,owe:Math.max(0,r2(each-paid))}})}}
function splitHTML(ev,l){const cols=ev.collaborators||[];if(cols.length<2)return `<div class="stack ccard ${cc('bk-split')}" style="gap:6px"><h3 ${cch('bk-split')}>Split the cost</h3><p class="sub">Add a co-planner to share this cost with them.</p><button class="btn sm" data-cohost style="justify-self:start">Add a co-planner</button></div>`;

  return `<div class="stack ccard ${cc('bk-split')}" style="gap:8px"><div ${cch('bk-split')}><h3>Split the cost</h3><p class="sub" style="margin-top:2px">Choose who's sharing ${esc(SUP[l.booking.sup].name)}. Each person pays their part straight to the supplier.</p></div>
    <div class="chips">${cols.map(c=>`<button class="chip pick" data-splitto="${c.id}" aria-pressed="${sp.includes(c.id)}">${sp.includes(c.id)?I.check+' ':''}${esc(c.host?'You':c.n)}</button>`).join('')}</div>
    ${info?`<div class="splitlist">${info.parts.map(p=>`<div class="sprow"><span class="av" style="background:${p.c.c};margin:0">${esc(p.c.i)}</span><span style="min-width:0"><b class="small">${esc(p.isHost?'You':p.c.n)}</b><div class="sub num">Share ${fmt2(info.each)}${p.isHost?' · covered by your deposit and balance':p.paid?` · paid ${fmt2(p.paid)}`:''}</div></span>${p.isHost?'':p.owe>0?`<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-splitreq="${p.cid}">Send link</button><button class="btn sm primary" data-splitpaid="${p.cid}">Mark paid</button></span>`:'<span class="pill good">Paid</span>'}</div>`).join('')}</div><span class="sub">Split equally after guest contributions (${fmt2(info.base)} to share).</span>`:''}</div>`}
function whoPaysHTML(e){const cols=e.collaborators||[];if(cols.length<2)return '';const tot={};cols.forEach(c=>tot[c.id]={c,share:0,paid:0});const host=hostOf(e);

function mViewing(){const m=S.modal,s=SUP[m.sup],v=vset(s),k=VKIND(s.cat);const days=[];for(let i=1;i<=28&&days.length<8;i++){const d=addDays(TODAY,i),sl=slotsOn(s,d);if(sl.length)days.push([d,sl])}
  if(!m.how||!v.where.includes(m.how))m.how=v.where[0];const fu=bookedWith(S.acctKey,s.id,S.event&&S.event.id),fee=apptFee(s,m.people||2,S.acctKey,S.event&&S.event.id);

function mSView(){const m=S.modal,s=SUP[m.sup],x=viewingsOf(m.sup).find(y=>y.id===m.id);if(!x){S.modal=null;return ''}const who=x.acc?personName(x.acc):x.who,k=VKIND(s.cat),v=vset(s),h=x.how||v.where[0];

function mVReceipt(){const m=S.modal,s=SUP[m.sup],x=viewingsOf(m.sup).find(y=>y.id===m.id);if(!x||!x.fee){S.modal=null;return ''}const lg=legalOf(s),k=VKIND(s.cat),vls=lg.vatReg?vatLines({[vatDefault(s)]:1},x.fee):[],vat=vls.reduce((a,y)=>a+y.vat,0);

function reconcileRefunds(ev,acc){if(!ev)return;ev.lines.forEach(l=>{const bk=l.booking;if(!bk||!SUP[bk.sup])return;if(TODAY>lockDate(ev,l))return;
  const q=lineQuote(l,ev);const host=bkPaid(bk),guest=guestPaidFor(ev,bk.sup);const excess=r2(host+guest-q.total);if(excess<0.5||host<=0)return;const amt=r2(Math.min(excess,host));
  (bk.payments=bk.payments||[]).push({id:payId(),kind:'refund',amount:-amt,at:TODAY,by:'host',auto:true});
  const sname=SUP[bk.sup].name;notify(acc||S.acctKey,`${fmt2(amt)} refunded from ${sname}: fewer guests than you'd paid for`,'workspace');notify('sup:'+bk.sup,`${fmt2(amt)} automatically refunded to the organiser of ${ev.name} after numbers dropped`,'supplier');
  if(S.event===ev)toast(`Numbers dropped, so ${fmt2(amt)} is on its way back to you from ${sname}`)})}
